# Builds an installable Android APK for free on GitHub's servers (no Expo or Play account needed).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also attach the APK to a Release.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONGS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/songs.json
      SHARE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk chhath-countdown-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chhath-countdown-apk
          path: chhath-countdown-*.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chhath-countdown-*.apk
